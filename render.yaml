services:
  - type: web
    name: zinoprosignalai-mt4
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ZINO_API_KEY
        sync: false
      - key: PORT
        value: 10000
